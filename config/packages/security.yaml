security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Customers (ROLE_USER) < staff < admin. Admins can do everything staff can.
    role_hierarchy:
        ROLE_STAFF: ROLE_USER
        ROLE_ADMIN: ROLE_STAFF

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\LoginEntryPoint
            access_denied_handler: App\Security\AccessDeniedHandler

            # The auth modal posts JSON to /login (see AuthController).
            json_login:
                check_path: app_login
                username_path: email
                password_path: password

            # Password guessing is rate limited per account and per client IP, so an
            # admin password cannot be attacked at full speed over the internet.
            login_throttling:
                max_attempts: 5           # per minute, per username
                interval: '1 minute'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            logout:
                path: app_logout
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # Staff run day-to-day orders and stock; everything else under /admin (dashboard, users, buyers, feedback) is admin-only.
        - { path: '^/admin/(orders|inventory)', roles: ROLE_STAFF }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/category, roles: ROLE_STAFF }
        - { path: ^/manage, roles: ROLE_STAFF }
        - { path: ^/account, roles: ROLE_USER }
        - { path: ^/my-orders, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
