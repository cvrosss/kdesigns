name: kdesigns

services:
  app:
    build: .
    container_name: kdesigns-app
    ports:
      - "8001:80"
    env_file: .env.docker
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: kdesigns-mysql
    env_file: .env.docker
    environment:
      MYSQL_DATABASE: kdesigns-db
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kdesigns-phpmyadmin
    environment:
      PMA_HOST: database
    ports:
      - "8081:80"
    depends_on:
      - database

volumes:
  # Holds the shop's data; external so `docker compose down -v` can never delete it.
  # First time on a new machine: docker volume create kdesigns-db-data
  database_data:
    name: kdesigns-db-data
    external: true
  app_vendor:
  app_var:

networks:
  default:
    name: kdesigns-network
