# Keep the Apache version out of responses and error pages.
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    FallbackResource /index.php

    # Dotfiles (.env, .git, ...) must never be served, even if one is copied into public/.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

<IfModule mod_headers.c>
    # PHP's own version banner; expose_php=Off in docker/php.ini removes it at the source too.
    Header always unset X-Powered-By

    # The admin panel must never be framed by another site (clickjacking).
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"

    # Scripts come from this origin only — the Tailwind CDN is gone, its CSS is now a static
    # file. 'unsafe-inline' is still needed by the two remaining inline <script> blocks
    # (admin/inventory and auth/login) and by inline style attributes in the templates.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

    # Only sent when the request actually arrived over HTTPS, so an HTTP-only
    # deployment can never lock its own visitors out.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
</IfModule>
