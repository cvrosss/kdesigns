; Applied to every container; the production compose file layers opcache tuning on top.

; Do not advertise the PHP version in response headers.
expose_php = Off

; Uploaded product photos are capped at 2 MB by the form; leave headroom for the multipart body.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M

; Errors belong in the log, never in the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Sessions
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
